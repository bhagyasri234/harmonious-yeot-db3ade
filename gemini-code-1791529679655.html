<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANDHRA PRADESH FORESTS & ECOSYSTEMS QUIZ - ED MATTERS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 0%, #0f172a, #020617);
      --glass-bg: rgba(15, 23, 42, 0.75);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-card: rgba(30, 41, 59, 0.5);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      
      --cyan: #06b6d4;
      --purple: #a855f7;
      --emerald: #10b981;
      --crimson: #ef4444;
      --amber: #f59e0b;
      
      --glow-cyan: 0 0 20px rgba(6, 182, 212, 0.35);
      --glow-purple: 0 0 20px rgba(168, 85, 247, 0.35);
      --glow-emerald: 0 0 20px rgba(16, 185, 129, 0.35);
      --glow-crimson: 0 0 20px rgba(239, 68, 68, 0.35);
      
      --palette-unvisited: rgba(148, 163, 184, 0.15);
      --palette-skipped: rgba(245, 158, 11, 0.25);
      --palette-answered: rgba(16, 185, 129, 0.25);
      --palette-current: rgba(6, 182, 212, 0.3);
    }

    [data-theme="light"] {
      --bg-gradient: radial-gradient(circle at 50% 0%, #f1f5f9, #e2e8f0);
      --glass-bg: rgba(255, 255, 255, 0.85);
      --glass-border: rgba(0, 0, 0, 0.08);
      --glass-card: rgba(255, 255, 255, 0.6);
      --text-main: #0f172a;
      --text-muted: #64748b;
      
      --cyan: #0284c7;
      --purple: #9333ea;
      --emerald: #059669;
      --crimson: #dc2626;
      --amber: #d97706;
      
      --glow-cyan: 0 4px 12px rgba(2, 132, 199, 0.15);
      --glow-purple: 0 4px 12px rgba(147, 51, 234, 0.15);
      --glow-emerald: 0 4px 12px rgba(5, 150, 105, 0.15);
      --glow-crimson: 0 4px 12px rgba(220, 38, 38, 0.15);
      
      --palette-unvisited: rgba(148, 163, 184, 0.2);
      --palette-skipped: rgba(217, 119, 6, 0.2);
      --palette-answered: rgba(5, 150, 105, 0.2);
      --palette-current: rgba(2, 132, 199, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* GLASSMORPHISM BASE */
    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
    }

    /* HEADER */
    header {
      height: 64px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 12px 12px 0 12px;
      z-index: 10;
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, var(--cyan), var(--purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-icon {
      background: var(--glass-card);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-icon:hover {
      border-color: var(--cyan);
      box-shadow: var(--glow-cyan);
    }

    .timer-display {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--cyan);
      background: rgba(6, 182, 212, 0.1);
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid rgba(6, 182, 212, 0.3);
    }

    /* SCREEN CONTAINERS */
    .screen {
      display: none;
      height: calc(100vh - 88px);
      padding: 12px;
      gap: 12px;
    }

    .screen.active {
      display: flex;
    }

    /* LANDING SCREEN */
    #landing-screen {
      flex-direction: column;
      justify-content: center;
      align-items: center;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
      text-align: center;
    }

    .banner-highlight {
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.15), rgba(168, 85, 247, 0.15));
      border: 1px solid var(--purple);
      box-shadow: var(--glow-purple);
      padding: 12px 24px;
      border-radius: 30px;
      font-weight: 600;
      color: var(--purple);
      margin-bottom: 24px;
      font-size: 0.95rem;
    }

    .rules-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      width: 100%;
      margin: 24px 0;
    }

    .rule-card {
      padding: 20px;
      text-align: left;
    }

    .rule-card h4 {
      color: var(--cyan);
      font-size: 0.9rem;
      margin-bottom: 8px;
    }

    .rule-card p {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--cyan), var(--purple));
      border: none;
      color: #fff;
      padding: 14px 40px;
      font-size: 1.05rem;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: var(--glow-cyan);
      transition: all 0.2s ease;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      opacity: 0.95;
    }

    /* EXAM INTERFACE */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      overflow-y: auto;
    }

    .q-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--glass-border);
    }

    .q-number {
      font-weight: 700;
      color: var(--cyan);
      font-size: 1.1rem;
    }

    .q-marks {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .q-text {
      font-size: 1.1rem;
      line-height: 1.6;
      font-weight: 500;
      margin-bottom: 24px;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-card {
      background: var(--glass-card);
      border: 1px solid var(--glass-border);
      padding: 16px 20px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: all 0.15s ease;
    }

    .option-card:hover {
